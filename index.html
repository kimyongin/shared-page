<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shared Pages</title>
  <style>
    :root {
      --bg-0: #0b0e1a;
      --bg-1: #141a30;
      --bg-2: #1d2541;
      --line: rgba(255, 255, 255, 0.08);
      --text:     #e8ecf5;
      --text-dim: #b9c0d4;
      --text-mute:#7d8398;
      --accent: #5cd0ff;
      --accent-deep: #2c8fb8;
      --accent-glow: rgba(92, 208, 255, 0.35);
      --gold:  #ffd96b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background:
        radial-gradient(ellipse at top, rgba(92,208,255,0.06), transparent 55%),
        radial-gradient(ellipse at bottom, rgba(255,217,107,0.04), transparent 60%),
        var(--bg-0);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Pretendard', sans-serif;
      min-height: 100vh;
      letter-spacing: -0.005em;
    }
    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: clamp(48px, 10vw, 96px) clamp(20px, 6vw, 60px) 80px;
    }
    header.hero { text-align: center; margin-bottom: 56px; }
    .eyebrow {
      font-size: 11px; letter-spacing: 0.4em;
      color: var(--text-mute); text-transform: uppercase;
      margin-bottom: 18px; font-weight: 700;
    }
    h1 {
      font-size: clamp(36px, 6vw, 56px);
      letter-spacing: -0.02em;
      margin: 0 0 16px;
      background: linear-gradient(135deg, #fff 0%, var(--accent) 60%, var(--gold) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .lead {
      font-size: clamp(15px, 1.6vw, 17px);
      line-height: 1.7;
      color: var(--text-dim);
      max-width: 640px;
      margin: 0 auto;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
      margin-top: 32px;
    }
    a.card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: linear-gradient(160deg, var(--bg-2) 0%, var(--bg-1) 100%);
      border: 1.5px solid rgba(92, 208, 255, 0.3);
      border-radius: 16px;
      padding: 22px 22px 20px;
      position: relative;
      overflow: hidden;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1),
                  border-color 0.18s, box-shadow 0.18s;
    }
    a.card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.5;
    }
    a.card:hover {
      transform: translateY(-4px) rotate(-0.3deg);
      border-color: var(--accent);
      box-shadow: 0 12px 30px -6px var(--accent-glow);
    }
    .card-emoji {
      font-size: 36px; line-height: 1;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
    }
    .card-title {
      font-size: 17px; font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }
    .card-desc {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.55;
    }
    .card-meta {
      font-size: 11px;
      color: var(--text-mute);
      margin-top: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-meta::before {
      content: '';
      width: 16px; height: 1px;
      background: var(--text-mute);
    }
    footer {
      text-align: center;
      margin-top: 64px;
      padding-top: 32px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      color: var(--text-mute);
    }
    footer a { color: var(--text-dim); text-decoration: none; }
    footer a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="eyebrow">SHARED PAGES</div>
      <h1>공유 페이지 모음</h1>
      <p class="lead">
        실험, 정리, 공유용으로 만든 정적 페이지들을 한 곳에 모아둔 인덱스입니다.
      </p>
    </header>

    <div class="grid">
      <a class="card" href="./skills-deck/">
        <div class="card-emoji">🎴</div>
        <div class="card-title">Skills Deck</div>
        <div class="card-desc">
          Matt Pocock · Superpowers · GStack — 세 가지 코딩 에이전트 스킬 시스템을 카드 덱 형태로 비교·탐색.
        </div>
        <div class="card-meta">49 cards · 3 datasets</div>
      </a>
    </div>

    <footer>
      <a href="https://github.com/kimyongin/shared-page" target="_blank" rel="noopener">github.com/kimyongin/shared-page</a>
    </footer>
  </div>
</body>
</html>
