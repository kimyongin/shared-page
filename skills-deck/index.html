<!doctype html>
<html lang="ko">
 <head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스킬 카드 덱 — Matt Pocock · Superpowers</title>
<style>
  :root {
    --bg-deep:   #0b0f1c;
    --bg-mid:    #131a2c;
    --bg-soft:   #1c2440;
    --line:      #2a3556;
    --text:      #eef1fa;
    --text-dim:  #a3acc6;
    --text-mute: #6e7796;

    --eng:       #5cd0ff;
    --eng-deep:  #15436b;
    --eng-glow:  rgba(92, 208, 255, 0.35);

    --prod:      #ff8fd4;
    --prod-deep: #5b1f4a;
    --prod-glow: rgba(255, 143, 212, 0.4);

    --gold:      #ffd96b;
    --gold-deep: #6b4f10;
    --gold-glow: rgba(255, 217, 107, 0.4);

    --radius-card: 22px;
    --radius-block: 12px;

    --ease-pop:  cubic-bezier(0.22, 0.9, 0.3, 1.06);
    --ease-out:  cubic-bezier(0.4, 0, 0.6, 1);
  }

  * { box-sizing: border-box; }

  /* 모든 스크롤바 숨김 — 스크롤은 그대로 작동 */
  * {
    scrollbar-width: none;        /* Firefox */
    -ms-overflow-style: none;     /* IE / Edge legacy */
  }
  *::-webkit-scrollbar { display: none; }   /* WebKit (Chrome / Safari) */

  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1200px 800px at 10% -10%, #1c2756 0%, transparent 60%),
      radial-gradient(1000px 700px at 90% 10%, #3a1d4a 0%, transparent 60%),
      radial-gradient(900px 600px at 50% 110%, #143049 0%, transparent 65%),
      var(--bg-deep);
    color: var(--text);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI',
                 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    min-height: 100vh;
  }
  body.modal-open { overflow: hidden; }
  ::selection { background: var(--gold); color: #1a1300; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  /* ───── Tab Bar ───── */
  .tab-bar {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 28px 16px 0;
    flex-wrap: wrap;
  }
  .tab {
    padding: 10px 26px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-mute);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.04em;
    transition: all 0.2s var(--ease-pop);
    white-space: nowrap;
  }
  .tab:hover {
    background: rgba(255, 255, 255, 0.07);
    color: var(--text);
    border-color: var(--text-mute);
    transform: translateY(-1px);
  }
  .tab.active {
    background: linear-gradient(90deg, #ffe9a8 0%, #ffd96b 50%, #ff8fd4 100%);
    color: #1a1300;
    border-color: var(--gold);
    box-shadow: 0 0 30px -8px var(--gold-glow);
  }

  /* ───── Top Header (사이트 타이틀, 항상 보임) ───── */
  .top-header {
    text-align: center;
    padding: 56px 24px 8px;
    max-width: 900px;
    margin: 0 auto;
  }
  .top-header h1 {
    font-size: clamp(34px, 5vw, 56px);
    margin: 0 0 18px;
    background: linear-gradient(90deg, #ffe9a8 0%, #ffd96b 50%, #ff8fd4 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: -0.02em;
    font-weight: 800;
  }
  .top-header .top-intro {
    color: var(--text-dim);
    margin: 0 auto;
    max-width: 700px;
    font-size: 15px;
    line-height: 1.65;
  }
  .top-header .top-intro strong { color: var(--text); }
  .top-header .top-intro em { color: var(--gold); font-style: normal; }

  /* ───── Dataset Hero (탭별로 바뀜) ───── */
  .hero {
    text-align: center;
    padding: 28px 24px 16px;
    max-width: 900px;
    margin: 0 auto;
  }
  .hero p.lead {
    color: var(--text-dim);
    margin: 8px auto 18px;
    max-width: 660px;
    font-size: 15px;
    line-height: 1.6;
  }
  .hero p.lead strong { color: var(--text); }
  .hero p.lead em { color: var(--gold); font-style: normal; }
  .hero p.lead code {
    background: rgba(0,0,0,.3); padding: 2px 6px; border-radius: 4px;
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    color: var(--gold); font-size: 14px;
  }
  /* ───── Section heading ───── */
  .section-h {
    font-size: 14px;
    letter-spacing: 0.3em;
    color: var(--text-mute);
    text-transform: uppercase;
    margin: 56px 0 16px;
    padding: 0 clamp(20px, 6vw, 60px);
    display: flex; align-items: center; gap: 14px;
    font-weight: 700;
    max-width: 1280px;
    margin-left: auto; margin-right: auto;
  }
  .section-h::before {
    content: '';
    display: inline-block;
    width: 28px; height: 2px;
    background: linear-gradient(90deg, var(--gold), transparent);
  }
  .section-h small {
    margin-left: auto;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--text-mute);
    font-weight: 500;
  }

  /* ───── Tile grid ───── */
  .skill-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
    padding: 24px clamp(20px, 6vw, 60px) 56px;
    max-width: 1280px;
    margin: 0 auto;
  }
  .skill-tile {
    background: linear-gradient(160deg, #1d2541 0%, #141a30 100%);
    border: 1.5px solid var(--line);
    border-radius: 16px;
    padding: 18px 14px 16px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    transition: transform 0.18s var(--ease-pop), border-color 0.18s, box-shadow 0.18s;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    width: 100%;
    color: inherit;
    will-change: transform;
  }
  .skill-tile { border-color: rgba(92, 208, 255, 0.3); }
  .skill-tile::before {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--eng), transparent);
    opacity: 0.5;
  }
  .skill-tile:hover { transform: translateY(-4px) rotate(-0.4deg); border-color: var(--eng); box-shadow: 0 12px 30px -6px var(--eng-glow); }
  .skill-tile:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }

  .tile-emoji {
    font-size: 40px;
    line-height: 1;
    margin: 6px 0 2px;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
  }
  .tile-cmd {
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 13px;
    font-weight: 700;
    word-break: break-all;
    line-height: 1.2;
  }
  .skill-tile .tile-cmd { color: var(--eng); }
  .tile-role {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--text-mute);
    text-transform: uppercase;
    font-weight: 700;
  }
  .tile-summary {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.45;
    border-top: 1px solid var(--line);
    padding-top: 10px;
    margin-top: 6px;
    width: 100%;
  }

  /* ───── Detail card ───── */
  .card {
    background: linear-gradient(160deg, #1d2541 0%, #141a30 100%);
    border-radius: var(--radius-card);
    padding: 0;
    overflow: hidden;
    position: relative;
    border: 2px solid var(--line);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04) inset;
    isolation: isolate;
    width: 100%;
  }
  .card { border-color: rgba(92, 208, 255, 0.4); box-shadow: 0 30px 60px -20px rgba(0,0,0,0.7), 0 0 50px -8px var(--eng-glow); }

  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 60px 18px 22px;  /* 우측 60px: X 버튼(34px) + 마진 확보 */
    border-bottom: 1px solid var(--line);
    background: rgba(0, 0, 0, 0.2);
  }
  .card-head .cmd {
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 18px; font-weight: 700; letter-spacing: -0.01em;
  }
  .card .card-head .cmd { color: var(--eng); }

  .card-hero {
    text-align: center;
    padding: 28px 24px 22px;
    position: relative;
  }
  .card .card-hero { background: radial-gradient(closest-side at 50% 0%, rgba(92,208,255,0.10), transparent 75%); }
  .card-hero .emoji {
    font-size: 64px; line-height: 1;
    filter: drop-shadow(0 8px 20px rgba(0,0,0,0.5));
    margin-bottom: 8px;
  }
  .card-hero .role {
    font-size: 14px; letter-spacing: 0.3em;
    color: var(--text-mute); text-transform: uppercase;
    font-weight: 700; margin-bottom: 12px;
  }
  .card-hero .summary {
    font-size: 15px; color: var(--text-dim);
    max-width: 480px; margin: 0 auto;
    line-height: 1.5;
  }

  .stats {
    padding: 14px 18px 18px;
    display: flex; flex-direction: column;
    gap: 12px;
  }
  .stat-block {
    background: rgba(8, 12, 24, 0.55);
    border: 1px solid var(--line);
    border-radius: var(--radius-block);
    padding: 14px 16px;
  }
  .stat-block h4 {
    font-size: 12px; letter-spacing: 0.18em;
    text-transform: uppercase; margin: 0 0 8px;
    color: var(--text-dim);
    display: flex; align-items: center; gap: 6px;
    font-weight: 700;
  }
  .stat-block ul, .stat-block ol {
    margin: 0; padding-left: 20px;
    color: var(--text-dim); font-size: 14px;
  }
  .stat-block li { margin-bottom: 3px; }
  .stat-block p { margin: 0 0 6px; color: var(--text-dim); font-size: 14px; }
  .stat-block p:last-child { margin-bottom: 0; }
  .stat-block code:not(.inline) {
    display: block;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    background: rgba(0,0,0,0.45);
    padding: 8px 10px; border-radius: 6px;
    font-size: 12.5px; color: var(--text);
    border: 1px solid var(--line);
    margin-bottom: 8px;
    white-space: pre-wrap; word-break: break-word;
  }
  .stat-block code.inline {
    background: rgba(0,0,0,.3); padding: 1px 6px; border-radius: 3px;
    font-family: ui-monospace, monospace; font-size: 0.9em;
  }
  .stat-block em { color: var(--text); font-style: normal; font-weight: 600; }
  .stat-block .pop { color: var(--gold); font-weight: 600; }
  .stat-block blockquote {
    margin: 6px 0;
    padding: 6px 0 6px 12px;
    border-left: 2px solid var(--gold);
    color: var(--text);
    font-size: 13.5px;
  }

  .card-foot {
    padding: 14px 18px 18px;
    border-top: 1px solid var(--line);
    background: rgba(0,0,0,0.25);
    display: flex; flex-direction: column; gap: 8px;
  }
  .combo {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px;
  }
  .combo-label {
    font-size: 11px; letter-spacing: 0.18em; color: var(--text-mute);
    margin-right: 4px; text-transform: uppercase; font-weight: 700;
  }
  .combo .chip {
    font-family: ui-monospace, monospace; font-size: 12px;
    padding: 3px 8px; border-radius: 4px;
    border: 1px solid var(--line); background: rgba(0,0,0,0.3);
  }
  .card .combo .chip { color: var(--eng); border-color: var(--eng-deep); }
  .meta {
    font-size: 11px; letter-spacing: 0.05em;
    color: var(--text-mute);
    font-family: ui-monospace, monospace;
  }

  /* ───── Modal ───── */
  .modal {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    padding: clamp(16px, 4vh, 40px);
    background: rgba(5, 8, 18, 0);
    backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px);
    opacity: 0; visibility: hidden;
    transition: background 0.3s ease, backdrop-filter 0.3s ease,
                opacity 0.3s ease, visibility 0s linear 0.3s;
  }
  .modal.open {
    background: rgba(5, 8, 18, 0.72);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    opacity: 1; visibility: visible;
    transition: background 0.3s ease, backdrop-filter 0.3s ease, opacity 0.3s ease;
  }
  .modal-stage {
    position: relative;
    width: min(620px, 100%);
    max-height: 92vh;
    overflow-y: auto; overflow-x: hidden;
    border-radius: var(--radius-card);
    will-change: transform, opacity;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }
  .modal-stage::-webkit-scrollbar { width: 6px; }
  .modal-stage::-webkit-scrollbar-track { background: transparent; }
  .modal-stage::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .modal-close {
    position: absolute;
    top: 19px;
    right: 16px;
    z-index: 5;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text-mute);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
    padding: 0;
  }
  .modal-close svg { width: 12px; height: 12px; }
  .modal-close:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: var(--gold);
    color: var(--gold);
    transform: scale(1.08);
  }

  /* ───── Combos ───── */
  .combos {
    padding: 0 clamp(20px, 6vw, 60px) 80px;
    max-width: 1280px;
    margin: 0 auto;
  }
  .combo-card {
    background: linear-gradient(180deg, #1a2138 0%, #131a2c 100%);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 24px 22px;
    margin: 0 0 24px;
    position: relative;
    overflow: hidden;
  }
  .combo-card::before {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--gold), transparent);
  }
  .combo-card header {
    display: flex; align-items: baseline;
    gap: 14px; flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .combo-num { font-size: 24px; color: var(--gold); font-weight: 700; }
  .combo-card h3 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
  .combo-card .scenario {
    color: var(--text-dim); font-size: 14px;
    width: 100%; margin-top: 6px; font-style: italic;
  }
  .combo-flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 10px; }
  .combo-flow .arrow {
    color: var(--gold); font-size: 22px;
    align-self: center; padding: 0 4px;
    text-shadow: 0 0 8px var(--gold-glow);
    flex-shrink: 0;
  }

  .mini {
    flex: 0 0 180px; width: 180px;
    background: linear-gradient(160deg, #1f2740 0%, #161c30 100%);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 14px 12px;
    display: flex; flex-direction: column; gap: 6px;
    position: relative;
    transition: transform 0.15s var(--ease-pop), border-color 0.15s, box-shadow 0.15s;
    cursor: pointer;
    text-align: left;
    color: inherit; font: inherit;
  }
  .mini { border-color: rgba(92,208,255,0.3); }
  .mini.cli  { border-color: rgba(255,217,107,0.3); cursor: default; }
  .mini:hover { transform: translateY(-3px); box-shadow: 0 8px 24px -4px var(--eng-glow); border-color: var(--eng); }
  .mini.cli:hover  { transform: none; box-shadow: none; border-color: rgba(255,217,107,0.3); }
  .mini-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .mini .mini-emoji { font-size: 24px; line-height: 1; }
  .mini .mini-cmd {
    font-family: ui-monospace, monospace;
    font-size: 12px; font-weight: 600;
    word-break: break-all;
  }
  .mini .mini-cmd { color: var(--eng); }
  .mini.cli .mini-cmd { color: var(--gold); }
  .mini-role {
    font-size: 10px; letter-spacing: 0.18em;
    color: var(--text-mute); text-transform: uppercase; font-weight: 700;
  }
  .mini-why {
    font-size: 12px; line-height: 1.45; color: var(--text-dim);
    border-top: 1px solid var(--line);
    padding-top: 6px; margin-top: 2px;
  }
  .mini-why strong { color: var(--gold); font-weight: 600; }

  /* ───── Footer ───── */
  .footer-note {
    max-width: 720px; margin: 24px auto 60px;
    padding: 0 24px;
    color: var(--text-mute);
    font-size: 13px;
    text-align: center;
  }
  .footer-note a { color: var(--gold); border-bottom: 1px dotted var(--gold-deep); }
  .footer-note code {
    font-family: ui-monospace, monospace;
    background: rgba(0,0,0,.3);
    padding: 2px 8px; border-radius: 4px;
    color: var(--gold);
  }

  /* ───── MD Export 아이콘 버튼 + 모달 ───── */
  .md-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.03);
    color: var(--text-mute);
    cursor: pointer;
    transition: all 0.18s var(--ease-pop);
    flex-shrink: 0;
    padding: 0;
  }
  .md-button svg { width: 16px; height: 16px; }
  .md-button:hover {
    background: rgba(255,217,107,0.1);
    border-color: var(--gold);
    color: var(--gold);
    transform: translateY(-1px);
  }
  .md-modal {
    position: fixed; inset: 0; z-index: 200;
    display: flex; align-items: center; justify-content: center;
    padding: clamp(16px, 4vh, 40px);
    background: rgba(5, 8, 18, 0);
    backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px);
    opacity: 0; visibility: hidden;
    transition: background 0.25s ease, backdrop-filter 0.25s ease,
                opacity 0.25s ease, visibility 0s linear 0.25s;
  }
  .md-modal.open {
    background: rgba(5, 8, 18, 0.82);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    opacity: 1; visibility: visible;
    transition: background 0.25s ease, backdrop-filter 0.25s ease, opacity 0.25s ease;
  }
  .md-modal-stage {
    width: min(960px, 100%);
    max-height: 92vh;
    background: var(--bg-mid);
    border: 1px solid var(--line);
    border-radius: 16px;
    display: flex; flex-direction: column;
    overflow: hidden;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.7);
  }
  .md-modal-head {
    padding: 12px 14px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--line);
    background: rgba(0,0,0,0.3);
  }
  .md-modal-head h3 {
    margin: 0;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .md-modal-head .spacer { flex: 1; }
  .md-modal-head button {
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.05);
    color: var(--text);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
  }
  .md-modal-head button:hover {
    background: rgba(255,217,107,0.15);
    border-color: var(--gold);
    color: var(--gold);
  }
  .md-modal-head button.copied {
    background: rgba(92,208,255,0.15);
    border-color: var(--eng);
    color: var(--eng);
  }
  .md-modal-body {
    flex: 1;
    overflow: auto;
    padding: 16px 18px;
    background: rgba(0,0,0,0.45);
  }
  .md-modal-body pre {
    margin: 0;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.7;
    color: var(--text-dim);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
  @media (max-width: 540px) {
    .skill-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }

    /* 콤보 흐름: 가로 wrap 대신 세로 스택으로 — 모바일 공간 활용 극대화 */
    .combo-flow { flex-direction: column; align-items: stretch; gap: 6px; }
    .mini { flex: 0 0 auto; width: 100%; }
    .combo-flow .arrow { align-self: center; padding: 2px 0; }
    .combo-flow .arrow-symbol { transform: rotate(90deg); }  /* → 를 ↓ 로 */
  }
</style>
</head>
<body>

<!-- ─────── Top Header (정적) ─────── -->
<header class="top-header">

let active = 'matt';
const ds  = () => DATASETS[active];

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

//
// ─── HTML → Markdown 변환 헬퍼 ──────────────────────────────────
//
function htmlToMd(html) {
  if (!html) return '';
  return String(html)
    .replace(/<br\s*\/?>/gi, '  \n')
    .replace(/<strong>(.*?)<\/strong>/gi, '**$1**')
    .replace(/<b>(.*?)<\/b>/gi, '**$1**')
    .replace(/<em>(.*?)<\/em>/gi, '*$1*')
    .replace(/<i>(.*?)<\/i>/gi, '*$1*')
    .replace(/<code\s+class="inline">(.*?)<\/code>/gi, '`$1`')
    .replace(/<code>(.*?)<\/code>/gi, '`$1`')
    .replace(/<span\s+class="pop">(.*?)<\/span>/gi, '**$1**')
    .replace(/<span[^>]*>(.*?)<\/span>/gi, '$1')
    .replace(/<a\s+href="([^"]*)"[^>]*>(.*?)<\/a>/gi, '[$2]($1)')
    .replace(/<[^>]+>/g, '')
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>')
    .replace(/&quot;/g, '"')
    .replace(/&#39;/g, "'")
    .replace(/&amp;/g, '&')
    .trim();
}

//
// ─── 데이터셋 → Markdown 문서 ───────────────────────────────────
//
function datasetToMarkdown(d) {
  const out = [];

  out.push(`# ${d.preTitle}`);
  out.push('');
  out.push(htmlToMd(d.lead));
  out.push('');

  out.push('## 스킬');
  out.push('');

  for (const id in d.skills) {
    const s = d.skills[id];

    out.push(`### ${s.cmd} ${s.emoji}`);
    out.push('');
    out.push(`**${s.role} · ${s.roleEn}**`);
    out.push('');
    out.push(`> ${htmlToMd(s.tileSummary)}`);
    out.push('');
    out.push(htmlToMd(s.heroSummary));
    out.push('');

    out.push('**📌 언제 쓰나**');
    out.push('');
    s.when.forEach(w => out.push(`- ${htmlToMd(w)}`));
    out.push('');

    out.push('**🎮 어떻게 쓰나**');
    out.push('');
    s.howCode.forEach(c => {
      out.push('```');
      out.push(c);
      out.push('```');
    });
    if (s.howNote) {
      out.push('');
      out.push(htmlToMd(s.howNote));
    }
    out.push('');

    out.push('**⚡ 무엇을 하나**');
    out.push('');
    s.what.forEach(b => {
      if (b.type === 'p') {
        out.push(htmlToMd(b.html));
        out.push('');
      } else if (b.type === 'blockquote') {
        out.push(`> ${htmlToMd(b.html)}`);
        out.push('');
      } else if (b.type === 'ol') {
        b.items.forEach((i, idx) => out.push(`${idx + 1}. ${htmlToMd(i)}`));
        out.push('');
      } else if (b.type === 'ul') {
        b.items.forEach(i => out.push(`- ${htmlToMd(i)}`));
        out.push('');
      }
    });

    out.push('**🎁 결과물**');
    out.push('');
    s.output.forEach(o => out.push(`- ${htmlToMd(o)}`));
    out.push('');

    if (s.combos && s.combos.length) {
      const chips = s.combos.map(cid => {
        const linked = d.skills[cid];
        return linked ? `\`${linked.cmd}\`` : `\`${cid}\``;
      }).join(' · ');
      const note = s.comboNote ? ' — ' + htmlToMd(s.comboNote) : '';
      out.push(`**🔗 콤보**: ${chips}${note}`);
      out.push('');
    }

    out.push(`*${htmlToMd(s.meta)}*`);
    out.push('');
    out.push('---');
    out.push('');
  }

  out.push('## 콤보 시나리오');
  out.push('');

  d.combos.forEach(c => {
    out.push(`### ${c.n} ${c.title}`);
    out.push('');
    out.push(`*${htmlToMd(c.scenario)}*`);
    out.push('');

    const arrows = c.arrows || [];
    c.flow.forEach((item, i) => {
      let header;
      if (item.type === 'cli') {
        header = `${item.emoji} \`${item.cmd}\` _(${item.role})_`;
      } else {
        const sk = d.skills[item.skill];
        if (!sk) return;
        header = `${sk.emoji} \`${sk.cmd}\` _(${sk.role})_`;
      }
      out.push(`${i + 1}. ${header}`);
      out.push('');
      out.push(`   ${htmlToMd(item.why)}`);
      out.push('');
      // JSON에 명시된 special arrow만 출력 (기본 "→"는 숫자가 대신함)
      if (i < c.flow.length - 1 && arrows[i]) {
        out.push(`   _${arrows[i]}_`);
        out.push('');
      }
    });
    out.push('---');
    out.push('');
  });

  out.push('');
  out.push(htmlToMd(d.footer));
  out.push('');

  return out.join('\n');
}

function renderTile(id, s) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'skill-tile';
  btn.dataset.skill = id;
  btn.innerHTML = `
    <div class="tile-emoji">${s.emoji}</div>
    <div class="tile-cmd">${escapeHtml(s.cmd)}</div>
    <div class="tile-role">${escapeHtml(s.role)}</div>
    <div class="tile-summary">${escapeHtml(s.tileSummary)}</div>
  `;
  return btn;
}

function renderWhatBlock(b) {
  if (b.type === 'p')          return `<p>${b.html}</p>`;
  if (b.type === 'blockquote') return `<blockquote>${b.html}</blockquote>`;
  if (b.type === 'ol' || b.type === 'ul') {
    const tag = b.type;
    const styleAttr = b.style ? ` style="${b.style}"` : '';
    const items = b.items.map(i => `<li>${i}</li>`).join('');
    return `<${tag}${styleAttr}>${items}</${tag}>`;
  }
  return '';
}

        ${whatHtml}
      </div>
      <div class="stat-block">
        <h4>🎁 결과물</h4>
        <ul>${outputHtml}</ul>
      </div>
    </div>
    <footer class="card-foot">
      <div class="combo">
        <span class="combo-label">콤보</span>
        ${chipsHtml}${comboNoteHtml}
      </div>
      <div class="meta">${s.meta}</div>
    </footer>
  `;
  return card;
}

function renderMini(item) {
  if (item.type === 'cli') {
    return `
      <div class="mini cli" aria-disabled="true">
        <div class="mini-top"><span class="mini-emoji">${item.emoji}</span><span class="mini-cmd">${escapeHtml(item.cmd)}</span></div>
        <div class="mini-role">${escapeHtml(item.role)}</div>
        <div class="mini-why">${item.why}</div>
      </div>
    `;
  }
  const s = ds().skills[item.skill];
  if (!s) return '';
  return `
    <button class="mini" data-skill="${item.skill}" type="button">
      <div class="mini-top"><span class="mini-emoji">${s.emoji}</span><span class="mini-cmd">${escapeHtml(s.cmd)}</span></div>
      <div class="mini-role">${escapeHtml(s.role)}</div>
      <div class="mini-why">${item.why}</div>
    </button>
  `;
}

function renderCombo(c) {
  const arrows = c.arrows || [];
  const flowHtml = c.flow.map((item, i) => {
    let html = renderMini(item);
    if (i < c.flow.length - 1) {
      const arrow = arrows[i] || '→';
      const isSymbol = /^[→←↑↓⇒⇐⇔↔]$/.test(arrow);
      html += `<div class="arrow ${isSymbol ? 'arrow-symbol' : 'arrow-text'}">${escapeHtml(arrow)}</div>`;
    }
    return html;
  }).join('');
  return `
    <article class="combo-card">
      <header>
        <span class="combo-num">${c.n}</span>
        <h3>${escapeHtml(c.title)}</h3>
        <p class="scenario">${escapeHtml(c.scenario)}</p>
      </header>
      <div class="combo-flow">${flowHtml}</div>
    </article>
  `;
}

function renderAll() {
  const d = ds();

  // Hero
  document.getElementById('lead').innerHTML = d.lead;
  document.getElementById('footer-note').innerHTML = d.footer;

  // Grid
  const grid = document.getElementById('skill-grid');
  grid.innerHTML = '';
  for (const id in d.skills) grid.appendChild(renderTile(id, d.skills[id]));

  // Combos
  document.getElementById('combos').innerHTML = d.combos.map(renderCombo).join('');
}

function setActive(name) {
  if (active === name) return;
  if (!DATASETS[name]) return;
  active = name;
  document.querySelectorAll('.tab').forEach(t =>
    t.classList.toggle('active', t.dataset.dataset === name)
  );
  // 모달이 열려 있으면 즉시 닫기 (다른 데이터셋의 카드 표시 방지)
  if (document.getElementById('modal').classList.contains('open')) {
    document.getElementById('modal-close').click();
  }
  renderAll();
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => setActive(t.dataset.dataset));
});

renderAll();


//
// ════════════════════════════════════════════════════════════════
//   MODAL + FLIP ANIMATION
// ════════════════════════════════════════════════════════════════
//
(function () {
  const modal      = document.getElementById('modal');
  const stage      = document.getElementById('modal-stage');
  const closeBtn   = document.getElementById('modal-close');

  let lastSourceEl = null;
  let isAnimating  = false;

  const OPEN_MS  = 420;
  const CLOSE_MS = 260;

  function openSkill(srcEl) {
    if (isAnimating) return;
    const id = srcEl.dataset.skill;
    if (!id) return;

    const card = renderDetailCard(id);
    if (!card) return;

    isAnimating = true;
    lastSourceEl = srcEl;

    // 카드만 제거 (닫기 버튼은 stage 안에 영구 보존)
    stage.querySelectorAll('.card').forEach(c => c.remove());
    // 카드를 닫기 버튼 *앞에* 삽입 (닫기 버튼이 카드 위에 떠 있도록)
    stage.insertBefore(card, closeBtn);

    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
    document.body.classList.add('modal-open');

    const srcRect = srcEl.getBoundingClientRect();
    const dstRect = stage.getBoundingClientRect();
    if (!dstRect.width || !dstRect.height) {
      isAnimating = false;
      return;
    }

    const dx = srcRect.left - dstRect.left;
    const dy = srcRect.top  - dstRect.top;
    const sx = srcRect.width  / dstRect.width;
    const sy = srcRect.height / dstRect.height;

    stage.style.transformOrigin = '0 0';
    stage.style.transition      = 'none';
    stage.style.transform       = `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})`;
    stage.style.opacity         = '1';

    void stage.offsetWidth;

    requestAnimationFrame(() => {
      stage.style.transition = 'transform ' + OPEN_MS + 'ms cubic-bezier(0.16, 1, 0.3, 1)';
      stage.style.transform  = 'translate(0px, 0px) scale(1, 1)';
    });

    window.setTimeout(() => {
      stage.style.transition = '';
      isAnimating = false;
    }, OPEN_MS + 30);
  }

  function closeSkill() {
    if (isAnimating) return;
    if (!modal.classList.contains('open')) return;

    const card = stage.querySelector('.card');
    if (!card || !lastSourceEl) {
      finalizeClose();
      return;
    }

    isAnimating = true;

    const srcRect = lastSourceEl.getBoundingClientRect();
    const dstRect = stage.getBoundingClientRect();

    const dx = srcRect.left - dstRect.left;
    const dy = srcRect.top  - dstRect.top;
    const sx = srcRect.width  / Math.max(dstRect.width, 1);
    const sy = srcRect.height / Math.max(dstRect.height, 1);

    stage.style.transformOrigin = '0 0';
    stage.style.transition      = 'transform ' + CLOSE_MS + 'ms cubic-bezier(0.7, 0, 0.84, 0), opacity ' + CLOSE_MS + 'ms ease';

    requestAnimationFrame(() => {
      stage.style.transform = `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})`;
      stage.style.opacity   = '0';
    });

    window.setTimeout(finalizeClose, CLOSE_MS + 20);
  }

  function finalizeClose() {
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('modal-open');
    // 카드만 제거, 닫기 버튼은 stage 안에 보존
    stage.querySelectorAll('.card').forEach(c => c.remove());
    stage.style.transform       = '';
    stage.style.transformOrigin = '';
    stage.style.transition      = '';
    stage.style.opacity         = '';
    lastSourceEl = null;
    isAnimating  = false;
  }

  document.addEventListener('click', function (e) {
    const opener = e.target.closest('[data-skill]');
    if (opener) {
      e.preventDefault();
      openSkill(opener);
      return;
    }
    if (e.target === modal) closeSkill();
  });

  closeBtn.addEventListener('click', closeSkill);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeSkill();
  });
})();


//
// ════════════════════════════════════════════════════════════════
//   MD EXPORT — 현재 데이터셋을 Markdown으로 변환해 모달로 표시
// ════════════════════════════════════════════════════════════════
//
(function () {
  const btn       = document.getElementById('md-button');
  const modal     = document.getElementById('md-modal');
  const content   = document.getElementById('md-content');
  const copyBtn   = document.getElementById('md-copy');
  const closeBtn  = document.getElementById('md-close');
  const titleEl   = document.getElementById('md-modal-title');

  function open() {
    const md = datasetToMarkdown(ds());
    content.textContent = md;
    titleEl.textContent = active.toUpperCase() + ' — Markdown';
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
  }

  function close() {
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
  }

  btn.addEventListener('click', open);
  closeBtn.addEventListener('click', close);
  modal.addEventListener('click', e => { if (e.target === modal) close(); });

  copyBtn.addEventListener('click', async () => {
    const orig = copyBtn.textContent;
    try {
      await navigator.clipboard.writeText(content.textContent);
      copyBtn.textContent = '✓ 복사됨';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = orig;
        copyBtn.classList.remove('copied');
      }, 1500);
    } catch (err) {
      // 폴백: 텍스트 선택만
      const range = document.createRange();
      range.selectNodeContents(content);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && modal.classList.contains('open')) close();
  });
})();
</script>
